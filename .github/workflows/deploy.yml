name: Build and Deploy

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24.20.0'
                  cache: 'pnpm'

            - name: Setup Ruby
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
              with:
                  ruby-version: '3.4.10'
                  bundler-cache: true

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            # Dependency advisories are split by whether the package ships. The only production
            # dependency is prismjs, the one thing bundled into assets/js/, and it gates the
            # deploy. Everything else (sass, eslint, stylelint, esbuild, playwright, postcss and
            # their trees) runs here and on a laptop, then exits, on input that is this repo's own
            # source. Advisories there are almost all parser denial-of-service, so they are reported
            # and reviewed rather than allowed to block a static site.
            #
            # This is not the supply-chain control. A hijacked dev package running a postinstall
            # script is a real threat, and it is covered by minimumReleaseAge, blockExoticSubdeps,
            # and verifyStoreIntegrity in pnpm-workspace.yaml. Those are unaffected by this split.
            - name: Audit dependencies (production)
              run: pnpm audit --prod --audit-level=high

            - name: Audit dependencies (dev, informational)
              run: pnpm audit --dev --audit-level=high
              continue-on-error: true

            - name: Install Snyk CLI
              run: npm install -g snyk

            - name: Snyk SCA – Node production dependencies
              run: snyk test --file=package.json --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk SCA – Node dev dependencies (informational)
              run: snyk test --file=package.json --dev --severity-threshold=high
              continue-on-error: true
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk SCA – Ruby dependencies
              run: snyk test --file=Gemfile --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk code scan
              run: snyk code test --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Build styles
              run: pnpm run build:styles

            - name: Build scripts
              run: pnpm run build:scripts

            - name: Hash assets
              run: node script/hash-assets.mjs

            - name: Build Jekyll site
              run: bundle exec jekyll build
              env:
                  JEKYLL_ENV: production

            - name: Validate HTML with html-proofer
              run: bundle exec htmlproofer ./_site --disable-external --ignore-empty-mailto

            # test:ci and not test, because test/build-determinism.test.mjs shells out
            # to build:fonts and build:images, which this workflow does not run and has
            # no fonttools or ImageMagick for.
            - name: Run regression tests
              run: pnpm run test:ci

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site/

            # The Pages artifact above is a tarball shaped for the deploy action, so
            # browser-tests needs a plain copy of the build.
            - name: Upload site for browser tests
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: site
                  path: _site/
                  retention-days: 1

    # Playwright's browser builds are glibc-only, so this runs in the official
    # image and not on the runner. The tag must match the @playwright/test version
    # in package.json.
    browser-tests:
        runs-on: ubuntu-latest
        needs: build
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
            options: --ipc=host
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Download the built site
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: _site

            # All three engines. They ship in the image, so the cost is about 30
            # seconds of runtime.
            # HOME is set because the job runs as root while Actions points $HOME at
            # /github/home, which the image owns as pwuser. Firefox refuses to start
            # when it does not own $HOME; Chromium and WebKit do not check.
            - name: Run browser tests
              run: pnpm run test:e2e:all
              env:
                  HOME: /root

            - name: Upload the report when they fail
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: [build, browser-tests]
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
