name: Build and Deploy

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24.18.0'
                  cache: 'pnpm'

            - name: Setup Ruby
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
              with:
                  ruby-version: '3.4.10'
                  bundler-cache: true

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            # Dependency advisories are split by whether the package ships. The only production
            # dependencies are micromodal and prismjs, the two things bundled into assets/js/, and
            # those gate the deploy. Everything else (sass, eslint, stylelint, esbuild, postcss and
            # their trees) runs here and on a laptop, then exits, on input that is this repo's own
            # source. Advisories there are almost all parser denial-of-service, so they are reported
            # and reviewed rather than allowed to block a static site.
            #
            # This is not the supply-chain control. A hijacked dev package running a postinstall
            # script is a real threat, and it is covered by minimumReleaseAge, blockExoticSubdeps,
            # and verifyStoreIntegrity in pnpm-workspace.yaml. Those are unaffected by this split.
            - name: Audit dependencies (production)
              run: pnpm audit --prod --audit-level=high

            - name: Audit dependencies (dev, informational)
              run: pnpm audit --dev --audit-level=high
              continue-on-error: true

            - name: Install Snyk CLI
              run: npm install -g snyk

            - name: Snyk SCA – Node production dependencies
              run: snyk test --file=package.json --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk SCA – Node dev dependencies (informational)
              run: snyk test --file=package.json --dev --severity-threshold=high
              continue-on-error: true
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk SCA – Ruby dependencies
              run: snyk test --file=Gemfile --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk code scan
              run: snyk code test --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Build styles
              run: pnpm run build:styles

            - name: Build scripts
              run: pnpm run build:scripts

            - name: Hash assets
              run: node script/hash-assets.mjs

            - name: Build Jekyll site
              run: bundle exec jekyll build
              env:
                  JEKYLL_ENV: production

            - name: Validate HTML with html-proofer
              run: bundle exec htmlproofer ./_site --disable-external --ignore-empty-mailto

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
