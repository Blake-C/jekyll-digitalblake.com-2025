name: Build and Deploy

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24.18.0'
                  cache: 'pnpm'

            - name: Setup Ruby
              uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
              with:
                  ruby-version: '3.4.10'
                  bundler-cache: true

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit dependencies
              run: pnpm audit --audit-level=high

            - name: Install Snyk CLI
              run: npm install -g snyk

            - name: Snyk SCA – Node dependencies
              run: snyk test --file=package.json --dev --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk SCA – Ruby dependencies
              run: snyk test --file=Gemfile --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Snyk code scan
              run: snyk code test --severity-threshold=high
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

            - name: Build styles
              run: pnpm run build:styles

            - name: Build scripts
              run: pnpm run build:scripts

            - name: Hash assets
              run: node script/hash-assets.mjs

            - name: Build Jekyll site
              run: bundle exec jekyll build
              env:
                  JEKYLL_ENV: production

            - name: Validate HTML with html-proofer
              run: bundle exec htmlproofer ./_site --disable-external --ignore-empty-mailto

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
