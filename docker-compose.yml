services:
    app:
        build: .
        volumes:
            - .:/app
            - bundle_cache:/usr/local/bundle
            - pnpm_store:/home/appuser/.local/share/pnpm/store
        working_dir: /app
        # DNS hands back both A and AAAA records, but IPv6 egress from the container goes
        # nowhere. curl and Ruby fall back to IPv4; pnpm (undici) stalls until it times out,
        # so every registry request fails with ETIMEDOUT. Turning IPv6 off inside the
        # container leaves only the route that works.
        sysctls:
            net.ipv6.conf.all.disable_ipv6: 1
        env_file:
            - path: .env
              required: false
        ports:
            - '4005:4005' # Jekyll dev server
            - '35729:35729' # LiveReload
        command: pnpm run dev
        tty: true
        stdin_open: true

    # Playwright does not support musl: its browser builds are glibc-only, and the
    # app image above is Alpine. So the browser tests get their own service on the
    # official image, which is Ubuntu 24.04 with the browsers already installed.
    # Nothing downloads a browser at install time, and CI runs this same image.
    #
    # The tag must match the @playwright/test version in package.json exactly.
    # A mismatch between the driver and the bundled browsers is a runtime error.
    #
    # node_modules comes from the bind mount, so dependencies install once through
    # the app service and run from here.
    playwright:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
        volumes:
            - .:/app
        working_dir: /app
        # Chromium's default /dev/shm is too small in a container and it crashes
        # under load. The Playwright docs call for host IPC rather than raising it.
        ipc: host
        environment:
            CI: ${CI:-}
        # UI Mode and the Trace Viewer are both web apps the CLI can serve over
        # HTTP, so they work from here with no display and no VNC. They bind to
        # 0.0.0.0 rather than localhost, otherwise the container keeps them to
        # itself. Ports come from this project's block in
        # digitalblake-system-setup/notes/dev-ports.md.
        #
        # `docker compose run` ignores these unless you pass --service-ports.
        # See the Testing section of README.md for the commands.
        ports:
            - '24210:24210' # static server for _site (test/e2e/serve.mjs)
            - '24211:24211' # playwright test --ui
            - '24212:24212' # playwright show-trace
        # The Playwright image ships Node and npm but not pnpm, so this calls the
        # binary pnpm already linked into node_modules rather than going through it.
        #
        # Chromium only by default, which is the 8 second loop. Firefox and WebKit
        # are configured too: run `npm run test:e2e:all` in this service for all
        # three, which takes about 36 seconds. CI always runs all three.
        command: node_modules/.bin/playwright test --project=chromium

volumes:
    bundle_cache:
    pnpm_store:
