services:
    app:
        build: .
        volumes:
            - .:/app
            - bundle_cache:/usr/local/bundle
            - pnpm_store:/home/appuser/.local/share/pnpm/store
        working_dir: /app
        # DNS hands back both A and AAAA records, but IPv6 egress from the container goes
        # nowhere. curl and Ruby fall back to IPv4; pnpm (undici) stalls until it times out,
        # so every registry request fails with ETIMEDOUT. Turning IPv6 off inside the
        # container leaves only the route that works.
        sysctls:
            net.ipv6.conf.all.disable_ipv6: 1
        env_file:
            - path: .env
              required: false
        ports:
            - '4005:4005' # Jekyll dev server
            - '35729:35729' # LiveReload
        command: pnpm run dev
        tty: true
        stdin_open: true

    # Playwright's browser builds are glibc-only and the app image above is
    # Alpine, so the browser tests run on the official image instead. node_modules
    # comes from the bind mount, so dependencies install through the app service.
    #
    # The tag must match the @playwright/test version in package.json exactly. A
    # mismatch between the driver and the bundled browsers is a runtime error.
    playwright:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
        volumes:
            - .:/app
        working_dir: /app
        # Chromium's default /dev/shm is too small in a container and it crashes
        # under load. The Playwright docs call for host IPC rather than raising it.
        ipc: host
        environment:
            CI: ${CI:-}
        # UI Mode and the Trace Viewer serve over HTTP, so they need no display.
        # Both bind to 0.0.0.0, otherwise the container keeps them to itself.
        # Ports come from this project's block in
        # digitalblake-system-setup/notes/dev-ports.md.
        #
        # `docker compose run` ignores these unless you pass --service-ports.
        ports:
            - '24210:24210' # static server for _site (test/e2e/serve.mjs)
            - '24211:24211' # playwright test --ui
            - '24212:24212' # playwright show-trace
        # The Playwright image ships Node and npm but not pnpm, so this calls the
        # binary pnpm already linked into node_modules. Chromium only, since
        # `npm run test:e2e:all` covers the other two engines on demand.
        command: node_modules/.bin/playwright test --project=chromium

volumes:
    bundle_cache:
    pnpm_store:
