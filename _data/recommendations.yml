      and consistency, keeping us on track and calmly solving every problem that came his way. Blake is humble,
      collaborative, and incredibly sharp. He works effortlessly across teams, communicates technical concepts
      clearly, and brings a solutions-first mindset to everything he touches. Any organization would be lucky to
      have him on their team.

