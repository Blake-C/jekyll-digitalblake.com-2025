  quote: >-
      There are few developers that I've worked with that have the aptitude for writing and thinking about code,
      the way Blake does. I had the pleasure of working with Blake at Gray Digital Group as I directed web
      application projects. His insight and recommendations for handling key issues on a project always trended
      towards planning early, in order to properly manage the work going forward, as well as offering up solutions
      to issues, and not just pointing out roadblocks. Any lead/director knows the value of having someone on your
      team that is able to do this, as it creates value in meetings versus extending a talk with no solutions.
      Blake is relentless in his pursuit to create solutions to technical problems and yet knows when to offer up
      variable solutions if a path would extend beyond the budget/timeframe available. For myself as a team
      leader, it was absolutely invaluable having someone that not only had amazing attention to detail but was
      also able to step back and look at the bigger scope, in order to reassess and preemptively change course if
      needed. Blake always had a great disposition, regardless of the weather, crunch times at work, having a
      cold, you name it! That "soft skill", is something very rare among developers, and is highly valued. While
      he may get focused in the work he's doing, he's not the stereotypical uncommunicative developer, by far! As
      a developer, Blake has my highest recommendation for any code based projects.

