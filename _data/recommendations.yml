  quote: >-
      I worked with Blake for over three years at Seismic, where Blake was our lead developer. On top of being
      highly capable and reliable, Blake is one of the nicest, most patient, and dependable developers I’ve ever
      worked with. We went through two challenging site migrations and redesigns together. Anybody who has been
      through that knows the kinds of ups and downs, unexpected speed bumps, and difficult challenges that
      inevitably happen. Blake was a cool, calm, solid partner as we worked through them all. One of the things I
      love about Blake is his determination to find a way. You will very rarely hear a simple “no” from him. He’s
      the kind of guy that looks for solutions and ways to get to yes. He’ll do the research, so if he says
      something isn’t technically feasible, you can count on that. But you can also count on him suggesting an
      alternative. “We can’t do it this way, but if we can make this adjustment, we could do it.” Blake is a
      problem solver. Blake is also absolutely dedicated. We literally had to tell the guy to get offline and get
      some sleep. He takes on a tremendous amount and he delivers. Blake is not going to let you down. Whether
      it’s as a consultant or a permanent employee, you’ll be lucky to have Blake working for you.

