packages:
    - '.'

# pnpm v11 configuration
# Non-auth/registry settings (moved from .npmrc — pnpm v11 requirement)

# Allow pnpm to purge the modules directory without TTY confirmation (needed in containers/CI)
confirmModulesPurge: false

# Enforce frozen lockfile in all environments
frozenLockfile: true

# Pin exact versions by default — prevents silent minor/patch bumps on pnpm add
saveExact: true

# Audit on install — fail if moderate or higher severity issues are found
auditLevel: moderate

# Verify content hashes against the store on every install
verifyStoreIntegrity: true

# Block git repos, tarballs, and other non-registry sources as subdependencies
blockExoticSubdeps: true

# Require packages to be at least 7 days old — blocks same-day hijacked releases (Shai-Hulud mitigation)
minimumReleaseAge: 10080

# node-releases is a low-risk data package (list of Node.js release dates) — excluded so autoprefixer
# subdependency resolution isn't blocked when browserslist pulls in a fresh node-releases patch
minimumReleaseAgeExclude:
    - node-releases

# Warn about deprecated packages
strictDeprecatedDependencies: warn

# Network resilience
fetchTimeout: 60000
fetchRetryMinTimeout: 1000
fetchRetryMaxTimeout: 10000

allowBuilds:
    '@parcel/watcher': true

catalog:
    # Production dependencies
    micromodal: 0.6.1
    prismjs: 1.30.0

    # Dev dependencies — build tools and linters most exposed to supply chain risk
    eslint: 10.3.0
    stylelint: 17.11.0
    webpack: 5.106.2
    webpack-cli: 7.0.2
    sass: 1.99.0
    postcss-cli: 11.0.1
    husky: 9.1.7
    lint-staged: 17.0.4
