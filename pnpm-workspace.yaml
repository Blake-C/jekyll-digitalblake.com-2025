packages:
    - '.'

# pnpm v12 configuration
# Non-auth/registry settings (moved from .npmrc — pnpm v11 requirement)
#
# v12 rejects a setting it does not recognize instead of ignoring it, so every key
# here is one `pnpm config list` reports back. confirmModulesPurge was dropped with
# v11: the Rust CLI purges the modules directory without asking, so there is nothing
# left to pre-answer. strictDeprecatedDependencies was never a real pnpm setting in
# any version and had never taken effect; pnpm warns about deprecated packages anyway.

# Enforce frozen lockfile in all environments
frozenLockfile: true

# Pin exact versions by default — prevents silent minor/patch bumps on pnpm add
saveExact: true

# Audit on install — fail if moderate or higher severity issues are found
auditLevel: moderate

# Verify content hashes against the store on every install
verifyStoreIntegrity: true

# Stop a `pnpm run` whose node_modules does not match the lockfile. node_modules is
# bind-mounted and shared with the host, so it drifts in ways a build does not report:
# a host pnpm swaps the esbuild binary for the wrong platform, and a modules directory
# left over from an older pnpm broke the 12.3.4 install outright. Accepts true, false,
# "install", "warn", "error" or "prompt"; "prompt" would hang a container.
verifyDepsBeforeRun: error

# Fail rather than warn when a package declares an engines range the runtime misses.
# Everything runs in Docker, where the range is satisfied by construction, so in
# practice this only fires when pnpm is run on the host, which is already forbidden.
engineStrict: true

# Block git repos, tarballs, and other non-registry sources as subdependencies
blockExoticSubdeps: true

# Require packages to be at least 7 days old — blocks same-day hijacked releases (Shai-Hulud mitigation)
minimumReleaseAge: 10080

# Refuse a version whose publisher evidence is weaker than an earlier version of the
# same package had. A package that used to ship from a trusted publisher and now
# arrives with only provenance, or with nothing, fails the install. That drop is what
# a stolen maintainer account looks like, and minimumReleaseAge alone does not catch
# it: a hijacked release that simply waits out the age gate still installs.
# Verified against all 374 lockfile entries before turning it on.
trustPolicy: no-downgrade

# node-releases is a low-risk data package (list of Node.js release dates) — excluded so autoprefixer
# subdependency resolution isn't blocked when browserslist pulls in a fresh node-releases patch.
minimumReleaseAgeExclude:
    - node-releases

# Network resilience. The two retry keys are spelled with a lowercase t, matching
# npm's fetch-retry-mintimeout; the camelCase spelling is silently ignored.
fetchTimeout: 60000
fetchRetryMintimeout: 1000
fetchRetryMaxtimeout: 10000

allowBuilds:
    '@parcel/watcher': true
    # esbuild's postinstall links the platform binary from its optional dependency.
    # Without it the bundler cannot run at all.
    esbuild: true

# Force patched transitive dependencies across the tree (each has a single version in the tree,
# so a blanket override is safe). Snyk-flagged; not caught by the npm/GitHub advisory DB.
#   js-yaml <4.3.2             — maxTotalMergeKeys does not bound CPU for empty merge sources, high
#                                (GHSA-2883-xcg3-v3hh), which bypasses the earlier GHSA-5p4m-2wfm-xmqj fix
#   nanoid <3.3.18             — custom generators loop indefinitely when size is zero, high
#                                (GHSA-2v37-7h3g-55p8); reaches the tree through postcss
#   brace-expansion <=5.0.8    — OOM DoS via unbounded intermediate arrays, high (GHSA-rgw5-rvv9-x895),
#                                which bypasses the earlier GHSA-mh99-v99m-4gvg fix
#   fast-uri <3.1.6            — SSRF via malformed IPv6 and repeated percent-decoding, plus host
#                                confusion via percent-encoded schemes and skipped IDN canonicalization,
#                                high (GHSA-jqff-g426-hqxp and three siblings); bypasses GHSA-7p8r-x3mc-p8w7
#   postcss-selector-parser    — uncontrolled recursion (CVE-2026-9358), consolidates 7.1.1 onto the patch
#   immutable <5.1.8 (via sass) — 32-bit trie overflow + hash-collision DoS, high (GHSA-v56q-mh7h-f735, GHSA-xvcm-6775-5m9r)
#   browserslist <4.28.7       — unbounded cache growth (CVE-2026-73089, GHSA-c83g-rgw3-j3cx) and a
#                                prototype write through untrusted browserslist-stats.json
#                                (CVE-2026-73088, GHSA-73wf-gq98-2v4g), both high; via autoprefixer
#   baseline-browser-mapping <2.11.0 — process termination on invalid input, moderate
#                                (GHSA-w5vr-8v7q-w6rv); reaches the tree through browserslist
#   colord <2.9.4              — slow rejection of oversized malformed color strings, moderate
#                                (GHSA-2wm5-q62r-hmrv); reaches the tree through stylelint
overrides:
    js-yaml: '^4.3.2'
    nanoid: '^3.3.18'
    brace-expansion: '^5.0.9'
    fast-uri: '^3.1.6'
    postcss-selector-parser: '^7.1.2'
    immutable: '^5.1.8'
    browserslist: '^4.28.7'
    baseline-browser-mapping: '^2.11.0'
    colord: '^2.9.4'

catalog:
    # Production dependencies
    prismjs: 1.30.0

    # Dev dependencies — build tools and linters most exposed to supply chain risk
    eslint: 10.9.1
    stylelint: 17.14.1
    esbuild: 0.28.2
    sass: 1.103.1
    husky: 9.1.7
    lint-staged: 17.4.1
