<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hand-edited after export. Sketch writes each layer shadow as an feOffset +
  feGaussianBlur filter, and ten of those over ellipses this size cost about
  10 seconds of rasterisation under Lighthouse mobile: /coding-projects/
  scored 57 with 4.7s of blocking time. Each shadow is now a radialGradient
  that fades from the same colour to transparent, which reproduces the halo,
  stays sharp at any scale, and paints in 23ms. The page scores 98.

  Re-exporting from Sketch will bring the filters back. Re-apply this change,
  or drop the layer shadows in Sketch before exporting.
-->
