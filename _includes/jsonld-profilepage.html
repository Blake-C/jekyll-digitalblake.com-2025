{%- assign default_author = site.data.authors[site.author.id] -%}
<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "ProfilePage",
		"url": "{{ page.url | remove: 'index.html' | absolute_url }}",
		"name": "{{ page.title | escape }} - {{ site.title | escape }}",
		"mainEntity": {
			"@type": "Person",
			"@id": "{{ site.url }}/#person",
			"name": {{ default_author.name | jsonify }},
			"url": "{{ site.url }}",
			"email": "mailto:{{ default_author.email }}",
			"jobTitle": {{ default_author.jobTitle | jsonify }},
			"description": {{ default_author.description | strip_newlines | strip | jsonify }},
			"address": {
				"@type": "PostalAddress",
				"addressLocality": {{ default_author.location.locality | jsonify }},
				"addressRegion": {{ default_author.location.region | jsonify }},
				"addressCountry": {{ default_author.location.country | jsonify }}
			},
			"knowsAbout": {{ default_author.knowsAbout | jsonify }},
			"sameAs": [
				"https://github.com/{{ site.github_username }}",
				"https://www.linkedin.com/in/blakecerecero/"
			]
		}
	}
</script>
