<ul id="menu-main-menu" class="main-menu">
	{%- for nav in site.nav_pages -%}
		{%- if nav.use_resume_url -%}
			{%- assign nav_href = site.resume_url -%}
		{%- else -%}
			{%- assign nav_href = nav.url | relative_url -%}
		{%- endif -%}
		<li class="menu-item">
			<a
				href="{{ nav_href }}"
				{% if nav.target %}
					target="{{ nav.target }}" rel="noreferrer noopener"
				{% endif %}
			>
				{{- nav.title -}}
			</a>
		</li>
	{%- endfor -%}
</ul>
