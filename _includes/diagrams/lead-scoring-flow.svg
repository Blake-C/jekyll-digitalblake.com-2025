<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 672" role="img" aria-labelledby="lsf-title lsf-desc" font-family="Montserrat, sans-serif">
	<title id="lsf-title">Lead scoring flow from form submission to Salesforce</title>
	<desc id="lsf-desc">Flow diagram. A visitor lands on the website and fills out a short lead form asking for name, email, and phone. On submit the data goes two places at once: into Marketo for capture and marketing automation, and into an AI scoring service that runs three checks, each producing a score: domain age plus registry, website content, and the person on LinkedIn. The three scores are averaged into a Lead Quality score from 0 to 10, which is written to a field in Salesforce, into a Lead Quality column the sales team sorts by.</desc>
	<defs>
		<marker id="lsf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0 0L10 5L0 10z" fill="#191936"/>
		</marker>
	</defs>

	<!-- Visitor -->
	<rect x="180" y="16" width="320" height="48" rx="10" fill="#fefefe" stroke="#191936" stroke-width="1.5"/>
	<text x="340" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#191936">Visitor lands on the website</text>

	<line x1="340" y1="64" x2="340" y2="98" stroke="#191936" stroke-width="2" marker-end="url(#lsf-arrow)"/>

	<!-- Short lead form -->
	<rect x="160" y="104" width="360" height="68" rx="10" fill="#fefefe" stroke="#191936" stroke-width="1.5"/>
	<text x="340" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#191936">Short lead form</text>
	<text x="340" y="156" text-anchor="middle" font-size="13" fill="#595959">name + email + phone</text>

	<!-- Fork: submit goes two places at once -->
	<path d="M340 172V196H150V232M340 196H470V232" fill="none" stroke="#191936" stroke-width="2"/>
	<line x1="150" y1="226" x2="150" y2="232" stroke="#191936" stroke-width="2" marker-end="url(#lsf-arrow)"/>
	<line x1="470" y1="226" x2="470" y2="232" stroke="#191936" stroke-width="2" marker-end="url(#lsf-arrow)"/>
	<text x="352" y="192" font-size="13" fill="#595959">submit</text>

	<!-- Marketo -->
	<rect x="40" y="240" width="220" height="68" rx="10" fill="#191936"/>
	<text x="150" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#fefefe">Marketo</text>
	<text x="150" y="292" text-anchor="middle" font-size="13" fill="#d3d4ff">capture / MAP</text>

	<!-- AI scoring service -->
	<rect x="300" y="240" width="340" height="196" rx="12" fill="#f4f5fc" stroke="#d3d4ff" stroke-width="1.5"/>
	<text x="470" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#191936">AI scoring service</text>
	<line x1="324" y1="286" x2="616" y2="286" stroke="#d3d4ff" stroke-width="1.5"/>

	<circle cx="336" cy="311" r="11" fill="#191936"/>
	<text x="336" y="315.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">1</text>
	<text x="356" y="316" font-size="14" fill="#191936">Domain age + registry</text>
	<rect x="560" y="299" width="56" height="24" rx="12" fill="#0072bc"/>
	<text x="588" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">score</text>

	<circle cx="336" cy="351" r="11" fill="#191936"/>
	<text x="336" y="355.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">2</text>
	<text x="356" y="356" font-size="14" fill="#191936">Website content</text>
	<rect x="560" y="339" width="56" height="24" rx="12" fill="#0072bc"/>
	<text x="588" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">score</text>

	<circle cx="336" cy="391" r="11" fill="#191936"/>
	<text x="336" y="395.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">3</text>
	<text x="356" y="396" font-size="14" fill="#191936">Person / LinkedIn</text>
	<rect x="560" y="379" width="56" height="24" rx="12" fill="#0072bc"/>
	<text x="588" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#fefefe">score</text>

	<line x1="470" y1="436" x2="470" y2="470" stroke="#191936" stroke-width="2" marker-end="url(#lsf-arrow)"/>
	<text x="482" y="460" font-size="13" fill="#595959">average the 3 scores</text>

	<!-- Lead Quality -->
	<rect x="335" y="476" width="270" height="52" rx="10" fill="#0072bc"/>
	<text x="470" y="508" text-anchor="middle" font-size="17" font-weight="700" fill="#fefefe">Lead Quality: 0 to 10</text>

	<line x1="470" y1="528" x2="470" y2="562" stroke="#191936" stroke-width="2" marker-end="url(#lsf-arrow)"/>
	<text x="482" y="552" font-size="13" fill="#595959">write to field</text>

	<!-- Salesforce -->
	<rect x="310" y="568" width="320" height="88" rx="10" fill="#191936"/>
	<text x="470" y="600" text-anchor="middle" font-size="17" font-weight="700" fill="#fefefe">Salesforce</text>
	<text x="470" y="623" text-anchor="middle" font-size="13" fill="#d3d4ff">Lead Quality column</text>
	<text x="470" y="643" text-anchor="middle" font-size="13" fill="#d3d4ff">sales sorts by this</text>
</svg>
