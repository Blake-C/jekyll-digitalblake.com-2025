{%- assign pillar = site.data.pillars[page.pillar] -%}
{%- assign members = site.posts | where: 'pillar', page.pillar | sort: 'date' | reverse -%}
<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "CollectionPage",
		"name": {{ pillar.title | jsonify }},
		"url": "{{ page.url | remove: 'index.html' | absolute_url }}",
		"description": {{ pillar.description | jsonify }},
		"mainEntity": {
			"@type": "ItemList",
			"numberOfItems": {{ members.size }},
			"itemListElement": [
				{%- for post in members -%}
				{
					"@type": "ListItem",
					"position": {{ forloop.index }},
					"url": "{{ post.url | absolute_url }}",
					"name": {{ post.title | jsonify }}
				}{%- unless forloop.last -%},{%- endunless -%}
				{%- endfor -%}
			]
		}
	}
</script>
